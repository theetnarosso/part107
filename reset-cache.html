<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Part107 Log</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef2f4;
      color: #172026;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(520px, 100%);
      display: grid;
      gap: 14px;
      border: 1px solid #d4dde3;
      border-radius: 8px;
      background: #fff;
      padding: 22px;
      box-shadow: 0 14px 30px rgba(23, 32, 38, .08);
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    p {
      margin: 0;
      color: #65717a;
      line-height: 1.45;
    }

    a {
      color: #0c6b58;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>Resetting Part107 Log</h1>
    <p id="status">Clearing the old offline app cache...</p>
    <p>If this page does not redirect, open <a href="./index.html?v=7">the updated app</a>.</p>
  </main>

  <script>
    async function resetApp() {
      const status = document.querySelector("#status");
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        status.textContent = "Cache cleared. Opening the updated app...";
      } catch (error) {
        status.textContent = "Cache reset was partly blocked. Opening the app anyway...";
      }
      window.location.replace("./index.html?v=7");
    }

    resetApp();
  </script>
</body>
</html>
